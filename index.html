<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101b35">
<title>FinoraTech Catatan Pro V3</title>

<style>
:root {
  --bg:#f3f5fa;
  --card:#ffffff;
  --text:#17233d;
  --muted:#8290a8;
  --primary:#315efb;
  --border:#e8edf5;
  --shadow:0 8px 30px rgba(25,45,90,.07);
}
body.dark {
  --bg:#101827;
  --card:#1b2940;
  --text:#f2f5ff;
  --muted:#a4b1c8;
  --border:#30415b;
  --shadow:0 8px 30px rgba(0,0,0,.15);
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Arial,sans-serif;transition:.2s;
}
header{
  background:linear-gradient(120deg,#101b35,#244ba9);
  color:white;padding:24px 6%;
}
.header-inner{
  max-width:1100px;margin:auto;
  display:flex;justify-content:space-between;align-items:center;
  gap:15px;flex-wrap:wrap;
}
.brand{font-size:22px;font-weight:800}
.brand span{color:#85b5ff}
.subtitle{font-size:12px;color:#c5d5ff;margin-top:5px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.top-btn{
  padding:10px 14px;border-radius:10px;
  background:#ffffff20;color:white;margin:3px;
}
.container{max-width:1100px;margin:25px auto;padding:0 16px}
.welcome{
  background:var(--card);padding:22px;border-radius:18px;
  box-shadow:var(--shadow);margin-bottom:20px;
}
.welcome h2{margin:0 0 8px}
.muted{color:var(--muted);font-size:13px}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:12px;margin-bottom:20px;
}
.stat{
  background:var(--card);padding:18px;border-radius:15px;
  box-shadow:var(--shadow);
}
.stat strong{display:block;font-size:25px;margin-top:8px}
.layout{
  display:grid;grid-template-columns:1fr 2fr;gap:18px;
}
.panel{
  background:var(--card);padding:20px;border-radius:17px;
  box-shadow:var(--shadow);margin-bottom:18px;
}
.panel h3{margin-top:0}
input,select,textarea{
  width:100%;padding:12px;margin:7px 0 13px;
  border:1px solid var(--border);border-radius:10px;
  background:var(--bg);color:var(--text);outline:none;
}
textarea{min-height:140px;resize:vertical}
.primary{
  background:var(--primary);color:white;
  padding:12px 17px;border-radius:10px;font-weight:bold;
}
.secondary{
  background:var(--bg);color:var(--text);
  padding:10px 13px;border-radius:9px;
  border:1px solid var(--border);
}
.note{
  border:1px solid var(--border);padding:16px;
  border-radius:13px;margin:12px 0;
}
.note h4{margin:0 0 9px}
.note-content{
  white-space:pre-wrap;overflow-wrap:anywhere;
  font-size:14px;line-height:1.6;
}
.note-meta{font-size:11px;color:var(--muted);margin-top:12px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.actions button{font-size:12px}
.badge{
  display:inline-block;background:#e8efff;color:#315efb;
  padding:5px 9px;border-radius:20px;font-size:11px;
}
.note.pinned{border-left:4px solid #f5b942}
.empty{text-align:center;color:var(--muted);padding:35px}
.reminder{
  padding:12px;border-radius:10px;
  background:var(--bg);margin:8px 0;
  border:1px solid var(--border);
}
footer{text-align:center;padding:25px;color:var(--muted);font-size:12px}
.hidden{display:none!important}
#lockScreen{
  position:fixed;inset:0;background:#101b35;z-index:99;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.lock-box{
  background:white;color:#17233d;padding:30px;
  border-radius:20px;width:100%;max-width:350px;text-align:center;
}
.lock-box input{text-align:center;font-size:24px;letter-spacing:8px}
@media(max-width:700px){
  .layout{grid-template-columns:1fr}
  .stats{gap:8px}
  .stat{padding:13px}
  .stat strong{font-size:21px}
  header{padding:20px 16px}
}
</style>
</head>

  <div class="lock-box">
    <h2>🔐 FinoraTech</h2>
    <p id="lockMessage">Masukkan PIN untuk membuka catatan</p>
    <input id="pinInput" type="password" maxlength="6"
      inputmode="numeric" placeholder="••••">
    <button class="primary" style="width:100%" onclick="unlock()">
      Buka Aplikasi
    </button>
    <p id="pinError" style="color:red;font-size:12px"></p>
  </div>
</div>

      <div class="subtitle">V3 PREMIUM EDITION · Your Ideas, Organized.</div>
    </div>
